services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardtrader
      POSTGRES_PASSWORD: cardtrader
      POSTGRES_DB: cardtrader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardtrader"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://cardtrader:cardtrader@postgres:5432/cardtrader?sslmode=disable
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

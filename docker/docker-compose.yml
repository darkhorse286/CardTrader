services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardtrader
      POSTGRES_PASSWORD: cardtrader
      POSTGRES_DB: cardtrader
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    command: postgres -c password_encryption=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardtrader"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://cardtrader:cardtrader@postgres:5432/cardtrader?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://cardtrader:cardtrader@postgres:5432/cardtrader?sslmode=disable"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardtrader
      POSTGRES_PASSWORD: cardtrader
      POSTGRES_DB: cardtrader
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardtrader"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga-migrate-test:
    image: openfga/openfga:v1.15.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://cardtrader:cardtrader@postgres-test:5432/cardtrader?sslmode=disable"
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: on-failure

  openfga-test:
    image: openfga/openfga:v1.15.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://cardtrader:cardtrader@postgres-test:5432/cardtrader?sslmode=disable"
    ports:
      - "8082:8080"
      - "8083:8081"
    depends_on:
      postgres-test:
        condition: service_healthy
      openfga-migrate-test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_test_data:
